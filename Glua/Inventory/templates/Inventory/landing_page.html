<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pharmsave Enterprise Management System</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.0/dist/css/bootstrap.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 50%, #7aa8d9 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .landing-container {
            width: 100%;
            max-width: 1200px;
        }

        .header-section {
            text-align: center;
            color: white;
            margin-bottom: 60px;
            animation: slideDown 0.8s ease-out;
        }

        .header-section h1 {
            font-size: 48px;
            font-weight: 700;
            margin-bottom: 15px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);
            letter-spacing: -1px;
        }

        .header-section p {
            font-size: 18px;
            opacity: 0.95;
            margin-bottom: 5px;
            font-weight: 300;
        }

        .header-section .subtitle {
            font-size: 14px;
            opacity: 0.8;
            margin-bottom: 20px;
        }

        .header-logo {
            font-size: 60px;
            margin-bottom: 20px;
            animation: bounce 2s infinite;
        }

        .cards-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-bottom: 40px;
        }

        .branch-card {
            background: white;
            border-radius: 16px;
            padding: 0;
            overflow: hidden;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.15);
            transition: all 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            cursor: pointer;
            text-decoration: none;
            color: inherit;
            display: flex;
            flex-direction: column;
            height: 100%;
            position: relative;
        }

        .branch-card:hover {
            transform: translateY(-15px);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.25);
        }

        .branch-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 6px;
            background: linear-gradient(90deg, var(--card-color), var(--card-color));
            transition: height 0.3s ease;
        }

        .branch-card:hover::before {
            height: 8px;
        }

        .card-header {
            padding: 20px 15px;
            text-align: center;
            position: relative;
        }

        .card-icon {
            font-size: 40px;
            margin-bottom: 10px;
            color: var(--card-color);
            display: inline-block;
            transition: transform 0.3s ease;
        }

        .branch-card:hover .card-icon {
            transform: scale(1.15) rotate(5deg);
        }

        .card-title {
            font-size: 18px;
            font-weight: 700;
            color: #333;
            margin-bottom: 5px;
        }

        .card-description {
            font-size: 12px;
            color: #666;
            margin-bottom: 0;
            font-weight: 500;
        }

        .card-body {
            padding: 15px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .card-link {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 10px 16px;
            background: var(--card-color);
            color: white;
            border-radius: 8px;
            font-weight: 600;
            transition: all 0.3s ease;
            text-decoration: none;
            border: none;
            cursor: pointer;
            font-size: 12px;
        }

        .card-link:hover {
            background: var(--card-color);
            transform: translateX(5px);
            text-decoration: none;
            color: white;
        }

        .card-link i {
            transition: transform 0.3s ease;
        }

        .card-link:hover i {
            transform: translateX(5px);
        }

        /* Card color variations */
        .card-blue-dark { --card-color: #0056b3; }
        .card-blue-med { --card-color: #0066cc; }
        .card-blue-bright { --card-color: #1e90ff; }
        .card-blue-light { --card-color: #0077ff; }

        .footer-section {
            text-align: center;
            color: white;
            padding-top: 30px;
            border-top: 1px solid rgba(255, 255, 255, 0.2);
            animation: slideUp 0.8s ease-out 0.3s both;
        }

        .footer-section p {
            font-size: 14px;
            opacity: 0.9;
            margin-bottom: 0;
        }

        .quick-links {
            margin-top: 20px;
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        .quick-links a {
            color: white;
            text-decoration: none;
            font-size: 13px;
            opacity: 0.8;
            transition: opacity 0.3s ease;
        }

        .quick-links a:hover {
            opacity: 1;
            text-decoration: underline;
        }

        /* Animations */
        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes bounce {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-10px);
            }
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .header-section h1 {
                font-size: 32px;
            }

            .header-section p {
                font-size: 16px;
            }

            .header-logo {
                font-size: 45px;
            }

            .cards-grid {
                grid-template-columns: 1fr;
                gap: 20px;
            }

            .card-title {
                font-size: 18px;
            }

            body {
                padding: 15px;
            }
        }

        @media (max-width: 480px) {
            .header-section h1 {
                font-size: 24px;
            }

            .header-section p {
                font-size: 14px;
            }

            .header-logo {
                font-size: 35px;
            }

            .card-title {
                font-size: 16px;
            }

            .card-icon {
                font-size: 40px;
            }
        }

        /* Logout button styling */
        .logout-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            padding: 10px 20px;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: 2px solid white;
            border-radius: 8px;
            text-decoration: none;
            font-size: 13px;
            font-weight: 600;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .logout-btn:hover {
            background: white;
            color: #667eea;
            text-decoration: none;
        }

        .user-info {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .user-info i {
            font-size: 18px;
        }
    </style>
</head>
<body>
    <!-- User Info
    <div class="user-info">
        <i class="fas fa-user-circle"></i>
        <span>Welcome, {{ user.username }}!</span>
    </div> -->

    <!-- Logout Button
    <a href="{% url 'logout' %}" class="logout-btn">
        <i class="fas fa-sign-out-alt"></i> Logout
    </a> -->

    <!-- Main Container -->
    <div class="landing-container">
        <!-- Header Section -->
        <div class="header-section">
            <div class="header-logo">
                <i class="fas fa-hospital"></i>
            </div>
            <h1>Pharmsave Enterprises</h1>
            <p>Enterprise Management System</p>
            <p class="subtitle">Select your branch to manage inventory</p>
        </div>

        <!-- Cards Grid -->
        <div class="cards-grid">
            {% for branch in branches %}
            <a href="{{ branch.url }}" target="_blank" rel="noopener noreferrer" class="branch-card {% if forloop.counter == 1 %}card-blue-dark{% elif forloop.counter == 2 %}card-blue-med{% elif forloop.counter == 3 %}card-blue-bright{% else %}card-blue-light{% endif %}" style="--card-color: {{ branch.color }};">
                <div class="card-header">
                    <div class="card-icon">
                        <i class="fas {{ branch.icon }}"></i>
                    </div>
                    <h2 class="card-title">{{ branch.name }}</h2>
                    <p class="card-description">{{ branch.description }}</p>
                </div>
                <div class="card-body">
                    <button class="card-link">
                        <span>Visit Branch</span>
                        <i class="fas fa-arrow-right"></i>
                    </button>
                </div>
            </a>
            {% endfor %}
        </div>

        <!-- Footer Section -->
        <div class="footer-section">
            <p>&copy; 2026 Pharmsave Enterprises Ltd. All rights reserved.</p>
            <div class="quick-links">
                <a href="#">Support</a>
                <span>•</span>
                <a href="#">Documentation</a>
                <span>•</span>
                <a href="#">System Status</a>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
